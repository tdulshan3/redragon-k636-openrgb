# Builds OpenRGB for Windows (x64) with the K636 patches applied, at the same
# OpenRGB commit the patches were tested on. The result is a zip under the
# run's "Artifacts": unzip it anywhere and run OpenRGB.exe.
name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/windows-build.yml'

env:
  OPENRGB_COMMIT: c6fc8016d215cca17d660c47746a08d7ea6a9175
  QT_VERSION: '6.8.3'

jobs:
  build:
    runs-on: windows-2022
    steps:
      # Keep LF line endings, or the patches no longer apply
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Get OpenRGB and apply the K636 patches
        shell: bash
        run: |
          git clone https://gitlab.com/CalcProgrammer1/OpenRGB.git
          cd OpenRGB
          git checkout "$OPENRGB_COMMIT"
          git apply --verbose ../patches/*.patch

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install jom (parallel make)
        run: choco install jom -y --no-progress
        continue-on-error: true

      - name: Build
        working-directory: OpenRGB
        run: |
          qmake OpenRGB.pro CONFIG-=debug_and_release CONFIG+=release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Get-Command jom -ErrorAction SilentlyContinue) { jom } else { nmake }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Bundle Qt and the MSVC runtime
        working-directory: OpenRGB
        run: |
          windeployqt --no-quick-import --no-translations --no-system-d3d-compiler --no-compiler-runtime --no-opengl-sw --no-network release\OpenRGB.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Plugins such as Effects need these two
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6Core5Compat.dll" release\
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6OpenGL.dll"      release\
          # App-local MSVC runtime, so the VC++ redistributable isn't needed
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" release\
          Remove-Item release\*.obj, release\*.pdb -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-K636-Windows-x64
          path: OpenRGB/release/
          retention-days: 30
